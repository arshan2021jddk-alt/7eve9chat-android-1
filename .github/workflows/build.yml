name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            || true

          docker image prune -af || true

      - name: Build Docker image
        run: |
          docker build -t telegram-build .

      - name: Build arm64 debug APK
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/home/source" \
            telegram-build \
            bash -lc '
              set -Eeuo pipefail

              rm -rf /home/gradle/*
              cp -R /home/source/. /home/gradle/

              cd /home/gradle

              gradle :TMessagesProj_App:assembleAfatciDebug \
                --stacktrace \
                --console=plain

              mkdir -p /home/source/TMessagesProj/build/outputs/apk

              cp -R \
                /home/gradle/TMessagesProj_App/build/outputs/apk/. \
                /home/source/TMessagesProj/build/outputs/apk/
            '

      - name: Verify APK output
        run: |
          set -Eeuo pipefail

          echo "APK files found:"
          find TMessagesProj/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          if ! find TMessagesProj/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit | grep -q .; then
            echo "::error::No APK file was produced"
            exit 1
          fi

      - name: Report failure log as a GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/report_failure.py

      - name: Publish APK as a GitHub Release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          APK_DIR="TMessagesProj/build/outputs/apk"

          mapfile -t APK_FILES < <(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK files found in $APK_DIR"
            exit 1
          fi

          echo "Uploading APK files:"
          printf ' - %s\n' "${APK_FILES[@]}"

          gh release delete latest-build \
            --yes \
            --repo "${GITHUB_REPOSITORY}" \
            || true

          git tag -f latest-build
          git push -f origin latest-build

          gh release create latest-build \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Latest debug build" \
            --notes "Run ${GITHUB_RUN_ID}" \
            "${APK_FILES[@]}"
