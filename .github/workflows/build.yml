name: Build APK (Mashahir)

on:
  workflow_dispatch:
  push:
    branches:
      - mashahir

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            || true

          docker image prune -af || true

      - name: Install 7eve9Chat signing key
        env:
          SEVEN_KEYSTORE_B64: ${{ secrets.SEVEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$SEVEN_KEYSTORE_B64" ]; then
            echo "$SEVEN_KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
            echo "Using the 7eve9Chat signing key"
          else
            echo "::warning::SEVEN_KEYSTORE_B64 secret not set - signing with the repository's default key"
          fi

      - name: Build Docker image
        run: |
          docker build -t telegram-build .

      - name: Build arm64 debug APK
        env:
          SEVEN_KEY_ALIAS: ${{ secrets.SEVEN_KEY_ALIAS }}
          SEVEN_STORE_PASSWORD: ${{ secrets.SEVEN_STORE_PASSWORD }}
          SEVEN_KEY_PASSWORD: ${{ secrets.SEVEN_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/home/source" \
            -e SEVEN_KEY_ALIAS -e SEVEN_STORE_PASSWORD -e SEVEN_KEY_PASSWORD \
            -e APP_VERSION_CODE_CI="$((7089 + GITHUB_RUN_NUMBER))" \
            telegram-build \
            bash -lc '
              set -Eeuo pipefail

              rm -rf /home/gradle/*
              cp -R /home/source/. /home/gradle/

              cd /home/gradle

              SIGNING_ARGS=()
              if [ -n "${SEVEN_STORE_PASSWORD:-}" ]; then
                SIGNING_ARGS=(-PRELEASE_KEY_ALIAS="$SEVEN_KEY_ALIAS" -PRELEASE_STORE_PASSWORD="$SEVEN_STORE_PASSWORD" -PRELEASE_KEY_PASSWORD="$SEVEN_KEY_PASSWORD")
              fi

              # errors also become annotations (readable through the API without the log)
              # every build a higher version code, so the app can update itself to it
              if ! gradle :TMessagesProj_App:assembleAfatciDebug -PAPP_VERSION_CODE="$APP_VERSION_CODE_CI" ${SIGNING_ARGS[@]+"${SIGNING_ARGS[@]}"} \
                --stacktrace \
                --console=plain 2>&1 | tee /tmp/gradle.log; then
                # one annotation (GitHub keeps only 10 per step): the Gradle summary first, then
                # Java / resource errors - never the C++ warnings
                { grep -A15 "What went wrong" /tmp/gradle.log | head -45; echo "----"; grep -E "\\.java:[0-9]+: error:|error: resource|AAPT: error|Manifest merger failed|ERROR:" /tmp/gradle.log | grep -v "C/C++" | head -25; } \
                  | grep -v "^\s*at " | sed "s/%/%25/g" | awk "{printf \"%s%%0A\", \$0}" | sed "s/^/::error title=Build failed::/" || true
                echo
                exit 1
              fi

              mkdir -p /home/source/TMessagesProj/build/outputs/apk

              cp -R \
                /home/gradle/TMessagesProj_App/build/outputs/apk/. \
                /home/source/TMessagesProj/build/outputs/apk/
            '

      - name: Verify APK output
        run: |
          set -Eeuo pipefail

          echo "APK files found:"
          find TMessagesProj/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          if ! find TMessagesProj/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit | grep -q .; then
            echo "::error::No APK file was produced"
            exit 1
          fi

      - name: Report failure log as a GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/report_failure.py

      - name: Publish APK as a GitHub Release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          APK_DIR="TMessagesProj/build/outputs/apk"

          mapfile -t APK_FILES < <(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK files found in $APK_DIR"
            exit 1
          fi

          echo "Uploading APK files:"
          printf ' - %s\n' "${APK_FILES[@]}"

          gh release delete mashahir-build \
            --yes \
            --repo "${GITHUB_REPOSITORY}" \
            || true

          git tag -f mashahir-build
          git push -f origin mashahir-build

          gh release create mashahir-build \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Mashahir build" --prerelease \
            --notes "Run ${GITHUB_RUN_ID} versionCode=$(( (7089 + GITHUB_RUN_NUMBER) * 10 + 9 )) commit=${GITHUB_SHA::8}" \
            "${APK_FILES[@]}"
