name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - name: Build Docker image (Android SDK/NDK toolchain)
        run: docker build -t telegram-build .

      - name: Build APKs
        run: docker run --rm -v ${{ github.workspace }}:/home/source telegram-build

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: TMessagesProj/build/outputs/bundle/**
          if-no-files-found: ignore
